<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>황소영 디지털 명함</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --navy:#1b2a6b;
    --navy-dark:#101c4a;
    --green:#4caf50;
    --ink:#1a1a1a;
    --sub:#6b6f7a;
    --bg:#eef1f8;
    --card-bg:#ffffff;
    --qr-bg:#f5f7fb;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    color:var(--ink);
    -webkit-text-size-adjust:100%;
  }
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    padding-top:max(16px, env(safe-area-inset-top));
    padding-bottom:max(16px, env(safe-area-inset-bottom));
  }

  .top-bar{
    grid-column:1/-1;
    height:7px;
    background:linear-gradient(90deg, var(--navy) 0%, var(--navy) 55%, var(--green) 100%);
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--card-bg);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 14px 40px rgba(16,28,74,0.16);
    display:grid;
    grid-template-columns:1fr;
  }

  /* ---- info panel ---- */
  .panel-info{
    padding:30px 26px 26px;
  }
  .lang-row{
    display:flex;
    justify-content:flex-end;
    margin:0 0 16px;
  }
  .lang-seg{
    border:1.5px solid var(--navy);
    background:#fff;
    color:var(--navy);
    font-size:11.5px;
    font-weight:800;
    padding:5px 13px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .lang-seg:first-child{ border-radius:999px 0 0 999px; border-right:none; }
  .lang-seg:last-child{ border-radius:0 999px 999px 0; }
  .lang-seg.active{ background:var(--navy); color:#fff; }
  .logo-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin:0 0 18px;
  }
  .logo-badge{
    flex-shrink:0;
    width:56px;
    height:56px;
    border-radius:14px;
    background:#fff;
    border:1px solid #e7e9f2;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .logo-badge img{
    width:82%;
    height:82%;
    object-fit:contain;
    display:none;
    background:#fff;
  }
  .logo-initial{
    color:var(--navy);
    font-size:24px;
    font-weight:800;
    line-height:1;
  }
  .name{
    font-size:clamp(26px, 7vw, 30px);
    font-weight:800;
    color:var(--navy-dark);
    letter-spacing:0.3px;
    margin:0 0 6px;
  }
  .title-main{
    font-size:clamp(15px, 4vw, 16.5px);
    font-weight:700;
    color:var(--ink);
    margin:0 0 12px;
    line-height:1.45;
  }
  .biz-list{
    list-style:none;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:0;
    margin:0 0 18px;
  }
  .biz-list li{
    font-size:12.5px;
    font-weight:700;
    color:var(--navy);
    background:rgba(27,42,107,0.08);
    padding:5px 12px;
    border-radius:999px;
  }
  .logo-text{
    min-width:0;
  }
  .logo-tagline{
    font-size:11.5px;
    font-weight:600;
    color:var(--sub);
    margin:0 0 3px;
    line-height:1.4;
  }
  .logo-org{
    font-size:14.5px;
    font-weight:800;
    color:var(--navy-dark);
    margin:0;
    line-height:1.3;
  }
  .divider{
    height:1px;
    background:#e7e9f2;
    margin:0 0 18px;
  }
  .contact-block p{
    font-size:13.5px;
    color:var(--sub);
    margin:0 0 7px;
    line-height:1.5;
    word-break:break-all;
  }
  .contact-block p strong{
    color:var(--ink);
    font-weight:600;
  }
  .contact-block .c-label{
    display:inline-flex;
    width:18px;
    color:var(--navy);
    vertical-align:-3px;
  }
  .copy-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:22px;
    height:22px;
    margin-left:6px;
    border:none;
    background:rgba(27,42,107,0.08);
    color:var(--navy);
    border-radius:6px;
    cursor:pointer;
    vertical-align:-6px;
    -webkit-tap-highlight-color:transparent;
  }
  .copy-btn:active{ background:rgba(27,42,107,0.18); }
  .c-label svg, .btn svg, .btn-save svg, .copy-btn svg{
    width:15px;
    height:15px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .btn-row{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:13px 10px;
    border-radius:13px;
    font-size:14.5px;
    font-weight:700;
    text-decoration:none;
    border:none;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-call{ background:var(--navy); color:#fff; }
  .btn-mail{ background:#fff; color:var(--navy); border:1.5px solid var(--navy); }
  .qr-org{
    font-size:12.5px;
    color:var(--navy);
    font-weight:700;
    text-align:center;
    margin:20px 0 0;
  }
  .btn-web{
    color:var(--navy);
    text-decoration:none;
    font-weight:600;
  }

  /* ---- qr panel ---- */
  .panel-qr{
    background:var(--qr-bg);
    padding:26px 24px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-top:1px solid #e7e9f2;
  }
  #qrcode{
    background:#fff;
    padding:12px;
    border-radius:16px;
    border:1px solid #e3e6f0;
    line-height:0;
  }
  #qrcode svg{
    display:block;
    width:190px;
    height:190px;
  }
  .qr-hint{
    font-size:12px;
    color:var(--sub);
    margin:12px 0 0;
    text-align:center;
  }

  /* ---- save-as-image ---- */
  .save-row{
    grid-column:1/-1;
    padding:0 26px 26px;
    border-top:1px solid #e7e9f2;
  }
  .btn-save{
    width:100%;
    margin-top:18px;
    padding:13px;
    border-radius:13px;
    border:1.5px solid var(--navy);
    background:#fff;
    color:var(--navy);
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-save:disabled{ opacity:.6; cursor:default; }

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(12px);
    background:var(--navy-dark);
    color:#fff;
    padding:12px 20px;
    border-radius:12px;
    font-size:13.5px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:9999;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
    max-width:88vw;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- wide screens: side-by-side like a real business card ---- */
  @media (min-width:640px){
    .card{
      max-width:680px;
      grid-template-columns:1.35fr 1fr;
    }
    .panel-info{
      padding:38px 34px;
    }
    .panel-qr{
      border-top:none;
      border-left:1px solid #e7e9f2;
      padding:34px;
    }
    .save-row{
      padding:0 34px 30px;
    }
  }
</style>
</head>

    document.getElementById('txtSaveBtn').textContent = c.saveBtn;
    document.getElementById('langKoBtn').classList.toggle('active', lang === 'ko');
    document.getElementById('langEnBtn').classList.toggle('active', lang === 'en');
    document.documentElement.lang = (lang === 'ko' ? 'ko' : 'en');
    renderQR(lang);
    currentLang = lang;
  }

  document.getElementById('langKoBtn').addEventListener('click', function(){ applyLanguage('ko'); });
  document.getElementById('langEnBtn').addEventListener('click', function(){ applyLanguage('en'); });

  applyLanguage('ko');

  // ---- 전화번호 복사 ----
  function showToast(msg, ms){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(function(){ t.classList.remove('show'); }, ms || 2200);
  }

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject){
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        resolve();
      } catch (e) { reject(e); }
    });
  }

  document.getElementById('copyPhoneBtn').addEventListener('click', function(){
    copyText('010-4299-4014').then(function(){
      showToast(CONTENT[currentLang].toastCopied);
    }).catch(function(){
      showToast(CONTENT[currentLang].toastCopyFail);
    });
  });

  // ---- 명함 이미지 저장 ----
  function downloadBlob(blob, fileName){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function roundCorners(canvas, cssRadius, cssWidth){
    var scale = canvas.width / cssWidth;
    var r = cssRadius * scale;
    var out = document.createElement('canvas');
    out.width = canvas.width;
    out.height = canvas.height;
    var ctx = out.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.arcTo(out.width, 0, out.width, out.height, r);
    ctx.arcTo(out.width, out.height, 0, out.height, r);
    ctx.arcTo(0, out.height, 0, 0, r);
    ctx.arcTo(0, 0, out.width, 0, r);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(canvas, 0, 0);
    return out;
  }

  document.getElementById('saveCardBtn').addEventListener('click', function(){
    var btn = this;
    var label = document.getElementById('txtSaveBtn');
    var langRow = document.querySelector('.lang-row');
    btn.disabled = true;
    label.textContent = CONTENT[currentLang].saveBtnBusy;
    langRow.style.visibility = 'hidden';

    var cardEl = document.querySelector('.card');

    Promise.resolve()
      .then(function(){
        return html2canvas(cardEl, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      })
      .then(function(canvas){
        var rounded = roundCorners(canvas, 22, cardEl.offsetWidth);
        return new Promise(function(resolve){ rounded.toBlob(resolve, 'image/png'); });
      })
      .then(function(blob){
        var c = CONTENT[currentLang];
        var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        var file = null;
        try { file = new File([blob], c.fileName, { type: 'image/png' }); } catch (e) { file = null; }

        if (isMobile && file && navigator.canShare && navigator.canShare({ files: [file] })) {
          return navigator.share({ files: [file], title: c.shareTitle })
            .then(function(){ showToast(c.toastShared); })
            .catch(function(shareErr){
              if (shareErr && shareErr.name === 'AbortError') return;
              downloadBlob(blob, c.fileName);
              showToast(c.toastSaved);
            });
        }
        downloadBlob(blob, c.fileName);
        showToast(c.toastSaved);
      })
      .catch(function(){
        showToast(CONTENT[currentLang].toastFail);
      })
      .then(function(){
        langRow.style.visibility = '';
        btn.disabled = false;
        label.textContent = CONTENT[currentLang].saveBtn;
      });
  });
</script>

</body>
